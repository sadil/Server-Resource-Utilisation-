<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5.0, user-scalable=yes">
    <title>Server Utilisation</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151e2e' } } } }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>

    <style>
        /* Utilities */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        input[type="color"] { 
            -webkit-appearance: none; border: none; padding: 0; 
            width: 20px; height: 20px; /* Smaller color picker */
            border-radius: 4px; overflow: hidden; cursor: pointer; 
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border: none; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; padding: 0; }

        :root { --chart-text: #334155; --bg-grey-bar: #e2e8f0; --sticky-bg: #ffffff; }
        .dark { --chart-text: #cbd5e1; --bg-grey-bar: #334155; --sticky-bg: #1e293b; }

        /* Sticky Columns - ADJUSTED WIDTHS */
        .sticky-col-1 { position: sticky; left: 0; z-index: 30; background-color: var(--sticky-bg); }
        /* Sticky Col 2 starts at 30px now (width of Col 1) */
        .sticky-col-2 { position: sticky; left: 30px; z-index: 30; background-color: var(--sticky-bg); border-right: 2px solid #e2e8f0; }
        .dark .sticky-col-2 { border-right-color: #334155; }

        /* Error State */
        .input-error {
            border: 2px solid #ef4444 !important; background-color: #fef2f2 !important; color: #b91c1c !important;
        }
        .dark .input-error { background-color: #450a0a !important; color: #fecaca !important; }

        /* Text Wrapping */
        th, td { white-space: normal !important; word-wrap: break-word !important; vertical-align: top; }
        
        .editable-header { min-width: 80px; white-space: normal; word-break: break-word; outline: none; cursor: text; display: block; padding-right: 20px; }
        .editable-header:focus { background-color: rgba(255,255,255,0.1); border-radius: 4px; }
        .autosize-input { width: 100%; white-space: nowrap; overflow: hidden; transition: font-size 0.1s; }

        /* Scroll Hint */
        .scroll-hint-wrapper {
            background: 
                linear-gradient(to right, var(--sticky-bg) 30%, rgba(255,255,255,0)),
                linear-gradient(to right, rgba(255,255,255,0), var(--sticky-bg) 70%) 0 100%,
                radial-gradient(farthest-side at 0 50%, rgba(0,0,0,0.2), rgba(0,0,0,0)),
                radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,0.2), rgba(0,0,0,0)) 0 100%;
            background-repeat: no-repeat;
            background-color: var(--sticky-bg);
            background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
            background-attachment: local, local, scroll, scroll;
        }
        .dark .scroll-hint-wrapper {
            background: 
                linear-gradient(to right, var(--sticky-bg) 30%, rgba(0,0,0,0)),
                linear-gradient(to right, rgba(0,0,0,0), var(--sticky-bg) 70%) 0 100%,
                radial-gradient(farthest-side at 0 50%, rgba(255,255,255,0.1), rgba(0,0,0,0)),
                radial-gradient(farthest-side at 100% 50%, rgba(255,255,255,0.1), rgba(0,0,0,0)) 0 100%;
            background-repeat: no-repeat;
            background-color: var(--sticky-bg);
            background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
            background-attachment: local, local, scroll, scroll;
        }

        /* POPUP */
        #custom-popup {
            z-index: 9999;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        #custom-popup.hidden-popup { opacity: 0; pointer-events: none; transform: translate(-50%, -20px); }
        #custom-popup.visible-popup { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen p-2 sm:p-4">

    <div id="error-log" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"></div>

    <div id="custom-popup" class="hidden-popup fixed top-6 left-1/2 w-[90%] max-w-md bg-white dark:bg-slate-800 border-l-4 border-red-500 shadow-2xl rounded p-4 text-sm sm:text-base">
        <div class="flex justify-between items-start">
            <div id="popup-content" class="text-slate-800 dark:text-slate-200 whitespace-pre-wrap font-medium"></div>
            <button id="btn-close-popup" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 ml-2">✕</button>
        </div>
        <div class="mt-2 text-xs text-slate-400 italic">Tap anywhere else to close</div>
    </div>

    <div class="max-w-7xl mx-auto space-y-4">
        
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-3">
                <h1 class="text-lg sm:text-xl font-bold text-blue-600 dark:text-blue-400 whitespace-nowrap">Server Utilisation</h1>
                <div class="flex gap-2">
                    <button id="btnUpdate" class="bg-green-600 hover:bg-green-700 text-white text-xs sm:text-sm font-semibold py-1.5 px-3 rounded shadow transition">↻ Update App</button>
                    <button id="btnReset" class="bg-red-500 hover:bg-red-600 text-white text-xs sm:text-sm font-semibold py-1.5 px-3 rounded shadow transition">Reset</button>
                </div>
            </div>
            <button id="btnTheme" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition"><span class="text-xl">🌗</span></button>
        </div>

        <div class="grid grid-cols-1 gap-4">
            
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <h2 class="text-base font-semibold mb-2">Utilization</h2>
                <div class="bg-slate-50 dark:bg-slate-900/50 p-2 rounded border-l-4 border-blue-500 text-xs sm:text-sm text-slate-600 dark:text-slate-400 mb-3">
                    <span class="inline-block w-3 h-3 bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 mr-1 align-middle"></span> 
                    <strong>Grey</strong>: Free Space. <strong>Striped</strong>: Limit Exceeded.<br>
                    <span class="text-red-500 font-bold">*</span> Click legend to filter. Chart redraws automatically.
                </div>
                <div class="relative h-[450px] w-full">
                    <canvas id="utilizationChart"></canvas>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-semibold">1. Configuration</h2>
                    <button onclick="addNewResource()" class="bg-green-600 text-white text-xs font-bold py-1 px-2 rounded hover:bg-green-700 shadow" title="Add Resource Column">+ Column</button>
                </div>
                <div class="overflow-x-auto relative scroll-hint-wrapper">
                    <table id="capacityTable" class="w-full text-left text-xs sm:text-sm border-collapse min-w-[600px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-semibold">2. Project Workloads</h2>
                    <button id="btnAddProject" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1 px-3 rounded shadow transition">+ Add Workload</button>
                </div>
                <div class="overflow-x-auto relative scroll-hint-wrapper">
                    <table id="projectsTable" class="w-full text-left text-xs sm:text-sm border-collapse min-w-[700px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody id="projectRows" class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { 
            if(msg.includes('Script error') || msg.includes('getParsed')) return true; 
            document.getElementById('error-log').classList.remove('hidden'); 
            document.getElementById('error-log').innerHTML = `Error: ${msg}`; 
            return false; 
        };
        
        document.addEventListener('DOMContentLoaded', () => { try { initApp(); } catch (e) { console.error(e); } });

        let clusterState = [];
        let projects = [];
        let resLabels = [];
        let resKeys = [];
        let myChart = null;
        let hiddenProjectIndices = new Set(); 

        const initialClusters = [
            { id: 'c1', name: 'Cluster 1', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c2', name: 'Cluster 2', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c3', name: 'Cluster 3', vcpu: 200, ram: 1000, storage_norm: 200, storage_fast: 50, vgpu: 20 }
        ];
        const initialProjects = [
            { id: 1, name: 'Web Portal', clusterId: 'c1', vcpu: 20, ram: 50, storage_norm: 10, storage_fast: 0, vgpu: 0, color: '#E74C3C' },
            { id: 2, name: 'API Service', clusterId: 'c2', vcpu: 30, ram: 64, storage_norm: 20, storage_fast: 5, vgpu: 2, color: '#F1C40F' },
            { id: 3, name: 'Data Lake', clusterId: 'c3', vcpu: 50, ram: 200, storage_norm: 50, storage_fast: 10, vgpu: 5, color: '#3498DB' }
        ];
        const initialKeys = ['vcpu', 'ram', 'storage_norm', 'storage_fast', 'vgpu'];
        const initialLabels = ['vCPU', 'Memory', 'Normal Storage', 'Fast Storage', 'vGPU'];
        const palette = ['#E74C3C', '#3498DB', '#F1C40F', '#9B59B6', '#2ECC71', '#E67E22', '#1ABC9C', '#34495E'];

        function initApp() {
            if (typeof Chart === 'undefined') return alert("Chart.js failed to load");
            
            document.getElementById('btnUpdate').addEventListener('click', forceUpdateApp);
            document.getElementById('btnReset').addEventListener('click', resetDefaults);
            document.getElementById('btnTheme').addEventListener('click', toggleTheme);
            document.getElementById('btnAddProject').addEventListener('click', addProject);
            document.getElementById('btn-close-popup').addEventListener('click', hidePopup);
            
            document.addEventListener('click', (e) => {
                const popup = document.getElementById('custom-popup');
                if (popup.classList.contains('visible-popup') && !popup.contains(e.target)) hidePopup();
            }, true);

            if (!loadState()) resetDataToDefaults(false);
            applyThemeClass();
            refreshUI();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + Date.now()).then(reg => reg.update()).catch(console.error);
        }

        async function forceUpdateApp() {
            if(!confirm("Update App?")) return;
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (let reg of regs) await reg.unregister();
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            }
            window.location.reload(true);
        }

        function resetDefaults() { if(confirm("Reset to defaults?")) resetDataToDefaults(true); }

        function resetDataToDefaults(refresh) {
            clusterState = JSON.parse(JSON.stringify(initialClusters));
            projects = JSON.parse(JSON.stringify(initialProjects));
            resLabels = [...initialLabels];
            resKeys = [...initialKeys];
            hiddenProjectIndices.clear();
            saveState();
            if(refresh) refreshUI();
        }

        function loadState() {
            try {
                const stored = localStorage.getItem('serverDashboardData_v15');
                if (!stored) return false;
                const data = JSON.parse(stored);
                if (!data.clusters || !data.projects) return false;
                clusterState = data.clusters;
                projects = data.projects;
                resLabels = data.labels || [...initialLabels];
                resKeys = data.keys || [...initialKeys];
                if(data.theme) localStorage.setItem('theme', data.theme);
                return true;
            } catch(e) { return false; }
        }

        function saveState() {
            const data = {
                clusters: clusterState, projects: projects, 
                labels: resLabels, keys: resKeys,
                theme: localStorage.getItem('theme') || 'light'
            };
            localStorage.setItem('serverDashboardData_v15', JSON.stringify(data));
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', current);
            applyThemeClass(); saveState(); updateChart();
        }
        function applyThemeClass() {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function refreshUI() {
            renderCapacityTable(); renderProjectTable(); updateChart();
        }

        function showPopup(msg) {
            const popup = document.getElementById('custom-popup');
            document.getElementById('popup-content').innerText = msg;
            popup.classList.remove('hidden-popup');
            popup.classList.add('visible-popup');
            if(window.popupTimeout) clearTimeout(window.popupTimeout);
            window.popupTimeout = setTimeout(hidePopup, 5000);
        }

        function hidePopup() {
            document.getElementById('custom-popup').classList.remove('visible-popup');
            document.getElementById('custom-popup').classList.add('hidden-popup');
        }

        function getUnifiedWarning(resIndex, clusterId) {
            const label = resLabels[resIndex] || 'Unknown';
            const key = resKeys[resIndex];
            const stats = getClusterUsageStats(clusterId, key);
            return `⚠️ LIMIT EXCEEDED\n\nResource: ${label}\nTotal Used: ${stats.used}\nCapacity: ${stats.capacity}\nExceeded By: ${stats.exceeded}`;
        }

        function bindLongPress(element, callback) {
            let timer;
            const start = (e) => { timer = setTimeout(() => { timer = null; callback(); }, 600); };
            const end = (e) => { if (timer) clearTimeout(timer); };
            element.addEventListener('contextmenu', (e) => { if(!timer) e.preventDefault(); });
            element.addEventListener('mousedown', start);
            element.addEventListener('touchstart', start, {passive: true});
            element.addEventListener('mouseup', end);
            element.addEventListener('touchend', end);
        }

        function getClusterUsageStats(clusterId, resourceKey) {
            let totalUsed = 0;
            projects.forEach(p => { 
                if(p.clusterId === clusterId) totalUsed += (parseFloat(p[resourceKey]) || 0); 
            });
            const cluster = clusterState.find(c => c.id === clusterId);
            const capacity = cluster ? (parseFloat(cluster[resourceKey]) || 1) : 1;
            return { used: totalUsed, capacity: capacity, exceeded: Math.max(0, totalUsed - capacity) };
        }

        window.addNewResource = function() {
            const name = prompt("Enter Name for new Resource:");
            if(!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            if(resKeys.includes(key)) return alert("Resource already exists");
            resKeys.push(key); resLabels.push(name);
            clusterState.forEach(c => c[key] = 0); projects.forEach(p => p[key] = 0);
            saveState(); refreshUI();
        }
