<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5.0, user-scalable=yes">
    <title>Server Utilisation</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151e2e' } } } }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>

    <style>
        /* Hide Spin Buttons */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Custom Color Picker */
        input[type="color"] { -webkit-appearance: none; border: none; padding: 0; width: 24px; height: 24px; border-radius: 4px; overflow: hidden; cursor: pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }

        /* Chart Variables */
        :root { --chart-text: #334155; --bg-grey-bar: #e2e8f0; --sticky-bg: #ffffff; }
        .dark { --chart-text: #cbd5e1; --bg-grey-bar: #334155; --sticky-bg: #1e293b; }

        /* STICKY COLUMNS CSS */
        .sticky-col-1 {
            position: sticky; left: 0; 
            z-index: 20; 
            background-color: var(--sticky-bg); /* Prevents transparency issues */
        }
        .sticky-col-2 {
            position: sticky; left: 45px; /* Width of col 1 + padding */
            z-index: 20;
            background-color: var(--sticky-bg);
            border-right: 2px solid #e2e8f0; /* Visual separator */
        }
        .dark .sticky-col-2 { border-right-color: #334155; }

        /* Ensure text wrapping in headers */
        th, td { white-space: normal; word-wrap: break-word; }
        
        /* Red Error Outline Class */
        .input-error {
            border: 2px solid #ef4444 !important; /* Red-500 */
            background-color: #fef2f2 !important; /* Red-50 */
            color: #b91c1c !important; /* Red-700 */
        }
        .dark .input-error {
            background-color: #450a0a !important; 
            color: #fecaca !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen p-2 sm:p-4">

    <!-- Global Error Log -->
    <div id="error-log" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"></div>

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- HEADER -->
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-3">
                <h1 class="text-lg sm:text-xl font-bold text-blue-600 dark:text-blue-400 whitespace-nowrap">Server Utilisation</h1>
                <div class="flex gap-2">
                    <button id="btnUpdate" class="bg-green-600 hover:bg-green-700 text-white text-xs sm:text-sm font-semibold py-1.5 px-3 rounded shadow transition">↻ Update</button>
                    <button id="btnReset" class="bg-red-500 hover:bg-red-600 text-white text-xs sm:text-sm font-semibold py-1.5 px-3 rounded shadow transition">Reset</button>
                </div>
            </div>
            <button id="btnTheme" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition">
                <span class="text-xl">🌗</span>
            </button>
        </div>

        <!-- MAIN GRID -->
        <div class="grid grid-cols-1 gap-4">
            
            <!-- CHART CARD -->
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <h2 class="text-base font-semibold mb-2">Utilization</h2>
                <div class="bg-slate-50 dark:bg-slate-900/50 p-2 rounded border-l-4 border-blue-500 text-xs sm:text-sm text-slate-600 dark:text-slate-400 mb-3">
                    <span class="inline-block w-3 h-3 bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 mr-1 align-middle"></span> 
                    <strong>Grey</strong>: Free Space. <strong>Striped</strong>: Limit Exceeded (Click to view details).
                    <br>Click legend items to filter workloads.
                </div>
                <div class="relative h-[400px] w-full">
                    <canvas id="utilizationChart"></canvas>
                </div>
            </div>

            <!-- CONFIG TABLE -->
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <h2 class="text-base font-semibold mb-2">1. Configuration</h2>
                <div class="overflow-x-auto relative">
                    <table id="capacityTable" class="w-full text-left text-xs sm:text-sm border-collapse min-w-[600px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>

            <!-- PROJECTS TABLE -->
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-semibold">2. Project Workloads</h2>
                    <button id="btnAddProject" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1 px-3 rounded shadow transition">+ Add Workload</button>
                </div>
                <div class="overflow-x-auto relative">
                    <table id="projectsTable" class="w-full text-left text-xs sm:text-sm border-collapse min-w-[700px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody id="projectRows" class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ERROR HANDLER ---
        window.onerror = function(msg, url, line) {
            if (msg === 'Script error.' || msg === 'Script error') return true; 
            const errDiv = document.getElementById('error-log');
            errDiv.classList.remove('hidden');
            errDiv.innerHTML = `<strong>Error:</strong> ${msg} (Line: ${line})`;
            return false;
        };

        document.addEventListener('DOMContentLoaded', () => { try { initApp(); } catch (e) { console.error(e); } });

        // --- STATE ---
        let clusterState = [];
        let projects = [];
        let resLabels = [];
        let myChart = null;

        const initialClusters = [
            { id: 'c1', name: 'Cluster 1', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c2', name: 'Cluster 2', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c3', name: 'Cluster 3', vcpu: 200, ram: 1000, storage_norm: 200, storage_fast: 50, vgpu: 20 }
        ];
        
        const initialProjects = [
            { id: 1, name: 'Web Portal', clusterId: 'c1', vcpu: 20, ram: 50, storage_norm: 10, storage_fast: 0, vgpu: 0, color: '#E74C3C' },
            { id: 2, name: 'API Service', clusterId: 'c2', vcpu: 30, ram: 64, storage_norm: 20, storage_fast: 5, vgpu: 2, color: '#F1C40F' },
            { id: 3, name: 'Data Lake', clusterId: 'c3', vcpu: 50, ram: 200, storage_norm: 50, storage_fast: 10, vgpu: 5, color: '#3498DB' }
        ];

        const resKeys = ['vcpu', 'ram', 'storage_norm', 'storage_fast', 'vgpu'];
        const defaultLabels = ['vCPU', 'Memory', 'Normal Storage', 'Fast Storage', 'vGPU'];
        const palette = ['#E74C3C', '#3498DB', '#F1C40F', '#9B59B6', '#2ECC71', '#E67E22', '#1ABC9C', '#34495E'];

        function initApp() {
            if (typeof Chart === 'undefined') {
                document.getElementById('error-log').classList.remove('hidden');
                document.getElementById('error-log').innerText = 'Chart.js failed to load.';
                return;
            }

            document.getElementById('btnUpdate').addEventListener('click', forceUpdateApp);
            document.getElementById('btnReset').addEventListener('click', resetDefaults);
            document.getElementById('btnTheme').addEventListener('click', toggleTheme);
            document.getElementById('btnAddProject').addEventListener('click', addProject);

            if (!loadState()) resetDataToDefaults(false);
            
            applyThemeClass();
            refreshUI();

            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + Date.now()).then(reg => reg.update()).catch(console.error);
        }

        async function forceUpdateApp() {
            if(!confirm("Update App?")) return;
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (let reg of regs) await reg.unregister();
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            }
            window.location.reload(true);
        }

        function resetDefaults() {
            if(confirm("Reset to defaults?")) resetDataToDefaults(true);
        }

        function resetDataToDefaults(refresh) {
            clusterState = JSON.parse(JSON.stringify(initialClusters));
            projects = JSON.parse(JSON.stringify(initialProjects));
            resLabels = [...defaultLabels];
            saveState();
            if(refresh) refreshUI();
        }

        function loadState() {
            try {
                const stored = localStorage.getItem('serverDashboardData_v10');
                if (!stored) return false;
                const data = JSON.parse(stored);
                if (!data.clusters || !data.projects) return false;
                clusterState = data.clusters;
                projects = data.projects;
                resLabels = data.labels || [...defaultLabels];
                if(data.theme) localStorage.setItem('theme', data.theme);
                return true;
            } catch(e) { return false; }
        }

        function saveState() {
            const data = {
                clusters: clusterState,
                projects: projects,
                labels: resLabels,
                theme: localStorage.getItem('theme') || 'light'
            };
            localStorage.setItem('serverDashboardData_v10', JSON.stringify(data));
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', current);
            applyThemeClass();
            saveState();
            updateChart();
        }

        function applyThemeClass() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function refreshUI() {
            renderCapacityTable();
            renderProjectTable();
            updateChart();
        }

        // --- HELPER: Calc Usage Stats ---
        function getClusterUsageStats(clusterId, resourceKey) {
            let totalUsed = 0;
            projects.forEach(p => {
                if(p.clusterId === clusterId) {
                    totalUsed += (parseFloat(p[resourceKey]) || 0);
                }
            });
            const cluster = clusterState.find(c => c.id === clusterId);
            const capacity = cluster ? (parseFloat(cluster[resourceKey]) || 1) : 1;
            return { used: totalUsed, capacity: capacity, exceeded: Math.max(0, totalUsed - capacity) };
        }

        // --- ALERT HELPERS ---
        function showLimitWarning(msg) {
            // Simple alert for now, can be modal later
            alert(msg);
        }

        // --- GLOBAL ACTIONS ---
        window.updateClusterName = (id, val) => { clusterState.find(c => c.id === id).name = val; saveState(); renderProjectTable(); updateChart(); };
        window.updateClusterCap = (id, k, val) => { clusterState.find(c => c.id === id)[k] = parseFloat(val) || 1; saveState(); renderProjectTable(); updateChart(); }; // Re-render project table to update highlighting
        window.updateLabel = (idx, val) => { resLabels[idx] = val; saveState(); renderProjectTable(); updateChart(); };
        
        window.updateProj = (idx, field, val) => {
            if(field !== 'name' && field !== 'clusterId' && field !== 'color') val = parseFloat(val) || 0;
            projects[idx][field] = val;
            saveState();
            // We must re-render the table to apply the red outline if limit exceeded
            renderProjectTable(); 
            updateChart();
        };

        window.removeProj = (idx) => { if(confirm('Delete?')) { projects.splice(idx, 1); saveState(); renderProjectTable(); updateChart(); } };
        window.duplicateProj = (idx) => {
            const copy = { ...projects[idx], id: Date.now() + Math.random(), name: projects[idx].name + " (Copy)" };
            projects.splice(idx + 1, 0, copy); saveState(); renderProjectTable(); updateChart();
        };
        
        function addProject() {
            projects.push({ id: Date.now(), name: 'New App', clusterId: 'c1', vcpu: 0, ram: 0, storage_norm: 0, storage_fast: 0, vgpu: 0, color: palette[projects.length % palette.length] });
            saveState(); renderProjectTable(); updateChart();
        }

        // --- RENDERERS ---
        const inputBase = "w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-2 py-1 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 text-base focus:outline-none";
        const headerInput = "w-full bg-transparent text-center font-bold text-slate-700 dark:text-slate-200 focus:bg-slate-200 dark:focus:bg-slate-600 rounded py-1 px-1 focus:outline-none text-base border border-transparent hover:border-slate-300 whitespace-normal";

        function renderCapacityTable() {
            const table = document.getElementById('capacityTable');
            // Sticky Cluster Name
            let theadHtml = `<tr><th class="p-2 min-w-[120px] sticky-col-1">Cluster Name</th>`;
            resLabels.forEach((label, idx) => {
                theadHtml += `<th class="p-2 min-w-[100px]"><input type="text" class="${headerInput}" value="${label}" onchange="updateLabel(${idx}, this.value)"></th>`;
            });
            theadHtml += `</tr>`;
            table.querySelector('thead').innerHTML = theadHtml;

            let tbodyHtml = '';
            clusterState.forEach(c => {
                let row = `<td class="p-2 sticky-col-1"><input type="text" class="${inputBase} font-bold" value="${c.name}" onchange="updateClusterName('${c.id}', this.value)"></td>`;
                resKeys.forEach(k => row += `<td class="p-2"><input type="number" class="${inputBase}" value="${c[k]}" onchange="updateClusterCap('${c.id}', '${k}', this.value)" min="1"></td>`);
                tbodyHtml += `<tr>${row}</tr>`;
            });
            table.querySelector('tbody').innerHTML = tbodyHtml;
        }

        function renderProjectTable() {
            const table = document.getElementById('projectsTable');
            // Sticky Color (1) and Name (2)
            let theadHtml = `<tr>
                <th class="p-2 w-[45px] sticky-col-1 z-30">Col</th>
                <th class="p-2 min-w-[140px] sticky-col-2 z-30">Name</th>
                <th class="p-2 min-w-[120px]">Assigned</th>`;
            resLabels.forEach(label => theadHtml += `<th class="p-2 min-w-[80px] whitespace-normal">${label}</th>`);
            theadHtml += `<th class="p-2 w-24 text-center">Actions</th></tr>`;
            table.querySelector('thead').innerHTML = theadHtml;

            const tbody = document.getElementById('projectRows');
            tbody.innerHTML = '';
            
            projects.forEach((p, idx) => {
                // Calculate Overloads to determine Red Highlights
                let isProjectInTrouble = false;
                let errorFields = {};

                resKeys.forEach(key => {
                    const stats = getClusterUsageStats(p.clusterId, key);
                    if (stats.exceeded > 0) {
                        // Check if THIS project contributes to the problem (has > 0 value)
                        if (parseFloat(p[key]) > 0) {
                            errorFields[key] = { exceeded: stats.exceeded, total: stats.used, limit: stats.capacity };
                            isProjectInTrouble = true;
                        }
                    }
                });

                const nameErrorClass = isProjectInTrouble ? 'input-error' : '';
                const nameClick = isProjectInTrouble ? `onclick="showLimitWarning('Project contains fields that exceed cluster limits!')"` : '';

                const opts = clusterState.map(c => `<option value="${c.id}" ${c.id === p.clusterId ? 'selected' : ''}>${c.name}</option>`).join('');
                
                let row = `
                    <td class="p-2 text-center sticky-col-1"><input type="color" value="${p.color}" onchange="updateProj(${idx}, 'color', this.value)"></td>
                    <td class="p-2 sticky-col-2">
                        <input type="text" class="${inputBase} ${nameErrorClass}" value="${p.name}" onchange="updateProj(${idx}, 'name', this.value)" ${nameClick}>
                    </td>
                    <td class="p-2"><select class="${inputBase}" onchange="updateProj(${idx}, 'clusterId', this.value)">${opts}</select></td>`;
                
                resKeys.forEach((k, rIdx) => {
                    const err = errorFields[k];
                    const inputErrClass = err ? 'input-error' : '';
                    const labelName = resLabels[rIdx];
                    const inputClick = err ? `onclick="showLimitWarning('⚠️ LIMIT EXCEEDED\\n\\nResource: ${labelName}\\nTotal Used: ${err.total}\\nCapacity: ${err.limit}\\nExceeded By: ${err.exceeded}')"` : '';
                    
                    row += `<td class="p-2">
                        <input type="number" class="${inputBase} ${inputErrClass}" value="${p[k]}" onchange="updateProj(${idx}, '${k}', this.value)" min="0" ${inputClick}>
                    </td>`;
                });
                
                row += `<td class="p-2 text-center flex justify-center gap-1">
                    <button class="bg-amber-500 text-white p-1.5 rounded hover:bg-amber-600 flex items-center justify-center shadow" onclick="duplicateProj(${idx})" title="Clone">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button class="bg-red-500 text-white p-1.5 rounded hover:bg-red-600 flex items-center justify-center shadow" onclick="removeProj(${idx})" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </td>`;
                tbody.innerHTML += `<tr>${row}</tr>`;
            });
        }

        // --- CHART HELPERS ---
        function getCssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }

        function getStripePattern(color) {
            const patternCanvas = document.createElement('canvas');
            const pCtx = patternCanvas.getContext('2d');
            patternCanvas.width = 10; patternCanvas.height = 10;
            pCtx.fillStyle = color; pCtx.fillRect(0,0,10,10);
            pCtx.strokeStyle = 'rgba(255,255,255,0.7)'; pCtx.lineWidth = 2;
            pCtx.beginPath(); pCtx.moveTo(0, 10); pCtx.lineTo(10, 0); pCtx.stroke();
            return patternCanvas;
        }

        const gridOverlayPlugin = {
            id: 'gridOverlay',
            afterDraw(chart) {
                const ctx = chart.ctx; const xAxis = chart.scales.x; const yAxis = chart.scales.y;
                const gridColor = localStorage.getItem('theme') === 'dark' ? '#cbd5e1' : '#1e293b';
                [100, 200].forEach(val => {
                    const x = xAxis.getPixelForValue(val);
                    ctx.save(); ctx.beginPath(); ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
                    ctx.lineWidth = 2; ctx.strokeStyle = gridColor; ctx.stroke(); ctx.restore();
                });
            }
        };
        Chart.register(gridOverlayPlugin);

        function updateChart() {
            const ctx = document.getElementById('utilizationChart').getContext('2d');
            
            let usageMap = {}; clusterState.forEach(c => usageMap[c.id] = Array(resKeys.length).fill(0));
            let offsets = Array(resKeys.length).fill(0).map(() => ({})); clusterState.forEach(c => offsets.forEach(row => row[c.id] = 0));
            let datasets = [];

            // Backgrounds
            const bgBarColor = getCssVar('--bg-grey-bar');
            clusterState.forEach((c, i) => {
                datasets.push({
                    label: `_BG_${c.id}`, data: resKeys.map(() => [i*100, (i*100)+100]),
                    backgroundColor: bgBarColor, barPercentage: 0.9, categoryPercentage: 0.9, grouped: false, order: 10, clusterId: c.id, clusterName: c.name
                });
            });

            // GRANULAR STRIPING LOGIC
            projects.forEach(p => {
                let pts = [];
                let bgColors = []; // Array of colors for this dataset (one per resource bar)
                
                const cIndex = clusterState.findIndex(c => c.id === p.clusterId);
                if(cIndex === -1) return;
                const base = cIndex * 100;
                const clusterObj = clusterState[cIndex];

                resKeys.forEach((key, rIdx) => {
                    const cap = clusterObj[key]; 
                    const pct = (p[key] / cap) * 100;
                    let start = base + offsets[rIdx][p.clusterId]; 
                    let end = start + pct;
                    
                    // Check if THIS SPECIFIC resource bar segment goes over 100% of cluster capacity
                    let isOverloaded = false;
                    if(end > base + 100) {
                        end = base + 100;
                        isOverloaded = true;
                    }

                    if (pct > 0 && start < end) {
                        pts.push([start, end]);
                    } else if (isOverloaded && start < (base + 100)) {
                        pts.push([start, base+100]); // Draw sliver if needed
                    } else {
                        pts.push(null);
                    }
                    
                    // Assign granular pattern/color for this specific bar
                    if(isOverloaded) {
                        const pattern = ctx.createPattern(getStripePattern(p.color), 'repeat');
                        bgColors.push(pattern);
                    } else {
                        bgColors.push(p.color);
                    }

                    usageMap[p.clusterId][rIdx] += pct; offsets[rIdx][p.clusterId] += pct;
                });
                
                datasets.push({ 
                    label: p.name, 
                    data: pts, 
                    backgroundColor: bgColors, // Now an array!
                    barPercentage: 0.9, categoryPercentage: 0.9, grouped: false, order: 1,
                    // Store overloaded state array for click handler
                    overloadedState: pts.map((pt, i) => {
                        if(!pt) return false;
                        const cIdx = clusterState.findIndex(c => c.id === p.clusterId);
                        const base = cIdx * 100;
                        const stats = getClusterUsageStats(p.clusterId, resKeys[i]);
                        return stats.exceeded > 0;
                    })
                });
            });

            if (myChart) myChart.destroy();
            
            const textColor = getCssVar('--chart-text');

            myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: resLabels, datasets: datasets },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const el = elements[0];
                            const dsIndex = el.datasetIndex;
                            const index = el.index; // resource index
                            const ds = myChart.data.datasets[dsIndex];
                            
                            // Check if this segment is overloaded
                            if (ds.overloadedState && ds.overloadedState[index]) {
                                const resourceName = resLabels[index];
                                showLimitWarning(`⚠️ LIMIT EXCEEDED\n\nResource: ${resourceName}\nClick 'OK' to fix in table.`);
                            }
                        }
                    },
                    scales: {
                        x: { min: 0, max: 300, stacked: false, grid: { display: false }, ticks: { color: textColor, callback: v => (v===0)?'0%':(v===100 || v===200 || v===300)?'100%':'' } },
                        x2: { position: 'top', min: 0, max: 300, grid: { display: false }, ticks: { color: textColor, font: { weight: 'bold', size: 12 }, callback: v => (v===50)?clusterState[0]?.name:(v===150)?clusterState[1]?.name:(v===250)?clusterState[2]?.name:'' } },
                        y: { stacked: false, ticks: { color: textColor, font: {size: 11} } }
                    },
                    plugins: {
                        legend: { display: true, position: 'top', labels: { filter: i => !i.text.startsWith('_BG_'), color: textColor }, onClick: Chart.defaults.plugins.legend.onClick },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    if (ctx.dataset.label.startsWith('_BG_')) {
                                        const cId = ctx.dataset.clusterId; const rIdx = ctx.dataIndex; const resKey = resKeys[rIdx];
                                        const used = usageMap[cId][rIdx]; const total = clusterState.find(c => c.id === cId)[resKey];
                                        const freePct = Math.max(0, 100 - used); const freeUnits = (freePct/100)*total;
                                        return [`Available: ${freePct.toFixed(1)}%`, `${Math.floor(freeUnits)} / ${total}`];
                                    }
                                    const raw = ctx.raw; const p = projects.find(proj => proj.name === ctx.dataset.label);
                                    const val = p ? p[resKeys[ctx.dataIndex]] : 0;
                                    return `${ctx.dataset.label}: ${(raw[1]-raw[0]).toFixed(1)}% (${val})`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
