<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5.0, user-scalable=yes">
    <title>Server Utilisation</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151e2e' } } } }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>

    <style>
        /* Utilities */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Custom Color Picker Reset */
        input[type="color"] {
            -webkit-appearance: none; border: none; padding: 0;
            width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            position: absolute; top: 0; left: 0;
        }

        :root { --chart-text: #334155; --bg-grey-bar: #e2e8f0; --sticky-bg: #ffffff; --border-col: #cbd5e1; }
        .dark { --chart-text: #cbd5e1; --bg-grey-bar: #334155; --sticky-bg: #1e293b; --border-col: #334155; }

        /* --- STICKY COLUMN SYSTEM --- */
        
        /* 1. Drag Handle */
        .sticky-left-1 {
            position: sticky; left: 0; z-index: 40;
            width: 30px; min-width: 30px; max-width: 30px;
            background-color: var(--sticky-bg);
            border-right: 1px solid #f1f5f9;
        }

        /* 2. Duplicate Icon (Projects only) or Cluster Name Start */
        .sticky-left-2 {
            position: sticky; left: 30px; z-index: 40;
            width: 24px; min-width: 24px; max-width: 24px;
            background-color: var(--sticky-bg);
        }

        /* 3. Name Field */
        .sticky-left-3 {
            position: sticky; left: 54px; z-index: 40; /* 30 + 24 */
            width: 110px; min-width: 110px; max-width: 110px;
            background-color: var(--sticky-bg);
            border-right: 2px solid var(--border-col);
        }

        /* Cluster Table Specific Stickiness (Only has Handle + Name) */
        .cluster-sticky-name {
            position: sticky; left: 30px; z-index: 40;
            width: 134px; min-width: 134px; /* Covers the space of Dup+Name */
            background-color: var(--sticky-bg);
            border-right: 2px solid var(--border-col);
        }

        /* Error State */
        .input-error { border: 2px solid #ef4444 !important; background-color: #fef2f2 !important; color: #b91c1c !important; }
        .header-error { background-color: #ef4444 !important; color: white !important; }
        .dark .input-error { background-color: #450a0a !important; color: #fecaca !important; }

        /* Text Wrapping */
        th, td { white-space: normal !important; word-wrap: break-word !important; vertical-align: middle; }
        .editable-header { min-width: 50px; outline: none; cursor: text; display: block; padding-right: 18px; font-size: 0.7rem; line-height: 0.9rem; }
        .autosize-input { width: 100%; white-space: nowrap; overflow: hidden; transition: font-size 0.1s; }

        /* Drag Handle */
        .drag-handle { cursor: grab; touch-action: none; padding: 12px 0; }
        .drag-handle:active { cursor: grabbing; }

        /* Overlays for Inputs */
        .input-wrapper { position: relative; width: 100%; }
        .overlay-btn {
            position: absolute; top: 0; right: 0; bottom: 0;
            width: 24px; display: flex; align-items: center; justify-content: center;
            color: #ef4444; font-weight: bold; cursor: pointer; z-index: 10;
        }
        .overlay-btn:hover { background-color: rgba(239, 68, 68, 0.1); }

        /* Popups */
        #custom-popup { z-index: 9999; transition: opacity 0.3s, transform 0.3s; }
        .hidden-popup { opacity: 0; pointer-events: none; transform: translate(-50%, -20px); }
        .visible-popup { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen p-1 sm:p-2">

    <div id="error-log" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"></div>

    <div id="custom-popup" class="hidden-popup fixed top-6 left-1/2 w-[90%] max-w-md bg-white dark:bg-slate-800 border-l-4 border-red-500 shadow-2xl rounded p-3 text-xs sm:text-sm">
        <div class="flex justify-between items-start">
            <div id="popup-content" class="text-slate-800 dark:text-slate-200 whitespace-pre-wrap font-medium"></div>
            <button id="btn-close-popup" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 ml-2">✕</button>
        </div>
        <div class="mt-2 text-[10px] text-slate-400 italic">Tap anywhere else to close</div>
    </div>

    <div class="max-w-7xl mx-auto space-y-2">

        <div class="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-slate-800 p-2 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-2">
                <h1 class="text-base sm:text-lg font-bold text-blue-600 dark:text-blue-400 whitespace-nowrap">Server Utilisation</h1>
                <div class="flex gap-1">
                    <button id="btnUpdate" class="bg-green-600 hover:bg-green-700 text-white text-[10px] sm:text-xs font-semibold py-1 px-2 rounded shadow transition">↻</button>
                    <button id="btnReset" class="bg-red-500 hover:bg-red-600 text-white text-[10px] sm:text-xs font-semibold py-1 px-2 rounded shadow transition">Reset</button>
                </div>
            </div>
            <button id="btnTheme" class="p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition"><span class="text-lg">🌗</span></button>
        </div>

        <div class="grid grid-cols-1 gap-2">

            <!-- CHART -->
            <div class="bg-white dark:bg-slate-800 p-2 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-end mb-1">
                    <h2 class="text-sm font-semibold">Utilization</h2>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400">
                        <span class="inline-block w-2 h-2 bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 mr-1 align-middle"></span>Free Space
                        <span class="text-red-500 font-bold ml-2">*</span> Drag rows to reorder
                    </div>
                </div>
                
                <!-- Dynamic Height Container -->
                <div id="chartContainer" class="relative w-full overflow-hidden">
                    <canvas id="utilizationChart"></canvas>
                </div>
            </div>

            <!-- CONFIG -->
            <div class="bg-white dark:bg-slate-800 p-2 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-sm font-semibold">1. Configuration</h2>
                    <div class="flex gap-1">
                        <button onclick="addCluster()" class="bg-indigo-600 text-white text-[10px] font-bold py-0.5 px-2 rounded hover:bg-indigo-700 shadow" title="Add New Cluster">+ Cluster</button>
                        <button onclick="addNewResource()" class="bg-green-600 text-white text-[10px] font-bold py-0.5 px-2 rounded hover:bg-green-700 shadow" title="Add Resource Column">+ Resource</button>
                    </div>
                </div>
                <div class="overflow-x-auto relative">
                    <table id="capacityTable" class="w-full text-left text-xs border-collapse min-w-[500px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody id="clusterRows" class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>

            <!-- PROJECTS -->
            <div class="bg-white dark:bg-slate-800 p-2 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-sm font-semibold">2. Project Workloads</h2>
                    <button id="btnAddProject" class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-semibold py-0.5 px-2 rounded shadow transition">+ Add Workload</button>
                </div>
                <div class="overflow-x-auto relative">
                    <table id="projectsTable" class="w-full text-left text-xs border-collapse min-w-[600px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody id="projectRows" class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { if(msg.includes('Script error') || msg.includes('getParsed')) return true; document.getElementById('error-log').classList.remove('hidden'); document.getElementById('error-log').innerHTML = `Error: ${msg}`; return false; };
        document.addEventListener('DOMContentLoaded', () => { try { initApp(); } catch (e) { console.error(e); } });

        let clusterState = [], projects = [], resLabels = [], resKeys = [], myChart = null, hiddenProjectIndices = new Set(), dragSrcEl = null;

        const initialClusters = [
            { id: 'c1', name: 'Cluster 1', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c2', name: 'Cluster 2', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c3', name: 'Cluster 3', vcpu: 200, ram: 1000, storage_norm: 200, storage_fast: 50, vgpu: 20 }
        ];
        const initialProjects = [
            { id: 1, name: 'Web Portal', clusterId: 'c1', vcpu: 20, ram: 50, storage_norm: 10, storage_fast: 0, vgpu: 0, color: '#E74C3C' },
            { id: 2, name: 'API Service', clusterId: 'c2', vcpu: 30, ram: 64, storage_norm: 20, storage_fast: 5, vgpu: 2, color: '#F1C40F' },
            { id: 3, name: 'Data Lake', clusterId: 'c3', vcpu: 50, ram: 200, storage_norm: 50, storage_fast: 10, vgpu: 5, color: '#3498DB' }
        ];
        const initialKeys = ['vcpu', 'ram', 'storage_norm', 'storage_fast', 'vgpu'];
        const initialLabels = ['vCPU', 'Memory', 'Normal Storage', 'Fast Storage', 'vGPU'];
        const palette = ['#E74C3C', '#3498DB', '#F1C40F', '#9B59B6', '#2ECC71', '#E67E22', '#1ABC9C', '#34495E'];

        function initApp() {
            if (typeof Chart === 'undefined') return alert("Chart.js failed");
            document.getElementById('btnUpdate').addEventListener('click', forceUpdateApp);
            document.getElementById('btnReset').addEventListener('click', resetDefaults);
            document.getElementById('btnTheme').addEventListener('click', toggleTheme);
            document.getElementById('btnAddProject').addEventListener('click', addProject);
            document.getElementById('btn-close-popup').addEventListener('click', hidePopup);
            document.addEventListener('click', (e) => {
                const popup = document.getElementById('custom-popup');
                if (popup.classList.contains('visible-popup') && !popup.contains(e.target)) hidePopup();
            }, true);
            if (!loadState()) resetDataToDefaults(false);
            applyThemeClass(); refreshUI();
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js?v=' + Date.now())
                    .then(reg => reg.update())
                    .catch(err => console.log('SW not found or failed, running in standard mode.'));
            }
        }

        async function forceUpdateApp() {
            if(!confirm("Update App?")) return;
            if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); for (let reg of regs) await reg.unregister(); }
            if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
            window.location.reload(true);
        }

        function resetDefaults() { if(confirm("Reset to defaults?")) resetDataToDefaults(true); }
        function resetDataToDefaults(refresh) {
            clusterState = JSON.parse(JSON.stringify(initialClusters));
            projects = JSON.parse(JSON.stringify(initialProjects));
            resLabels = [...initialLabels]; resKeys = [...initialKeys];
            hiddenProjectIndices.clear(); saveState(); if(refresh) refreshUI();
        }

        function loadState() {
            try {
                const stored = localStorage.getItem('serverDashboardData_v20');
                if (!stored) return false;
                const data = JSON.parse(stored);
                if (!data.clusters || !data.projects) return false;
                clusterState = data.clusters; projects = data.projects;
                resLabels = data.labels || [...initialLabels]; resKeys = data.keys || [...initialKeys];
                if(data.theme) localStorage.setItem('theme', data.theme);
                return true;
            } catch(e) { return false; }
        }
        function saveState() {
            const data = { clusters: clusterState, projects: projects, labels: resLabels, keys: resKeys, theme: localStorage.getItem('theme') || 'light' };
            localStorage.setItem('serverDashboardData_v20', JSON.stringify(data));
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', current);
            applyThemeClass(); saveState(); updateChart();
        }
        function applyThemeClass() {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function refreshUI() { renderCapacityTable(); renderProjectTable(); updateChart(); }

        function showPopup(msg) {
            document.getElementById('popup-content').innerText = msg;
            document.getElementById('custom-popup').classList.replace('hidden-popup', 'visible-popup');
            if(window.popupTimeout) clearTimeout(window.popupTimeout);
            window.popupTimeout = setTimeout(hidePopup, 5000);
        }
        function hidePopup() { document.getElementById('custom-popup').classList.replace('visible-popup', 'hidden-popup'); }

        function getUnifiedWarning(resIndex, clusterId) {
            const label = resLabels[resIndex] || 'Unknown';
            const key = resKeys[resIndex];
            const stats = getClusterUsageStats(clusterId, key);
            return `⚠️ LIMIT EXCEEDED\n\nResource: ${label}\nTotal Used: ${stats.used}\nCapacity: ${stats.capacity}\nExceeded By: ${stats.exceeded}`;
        }

        function bindLongPress(element, callback) {
            let timer;
            const start = () => { timer = setTimeout(() => { timer = null; callback(); }, 600); };
            const end = () => { if (timer) clearTimeout(timer); };
            element.addEventListener('contextmenu', (e) => { if(!timer) e.preventDefault(); });
            element.addEventListener('mousedown', start); element.addEventListener('touchstart', start, {passive: true});
            element.addEventListener('mouseup', end); element.addEventListener('touchend', end);
        }

        function getClusterUsageStats(clusterId, resourceKey) {
            let totalUsed = 0;
            projects.forEach(p => { if(p.clusterId === clusterId) totalUsed += (parseFloat(p[resourceKey]) || 0); });
            const cluster = clusterState.find(c => c.id === clusterId);
            const capacity = cluster ? (parseFloat(cluster[resourceKey]) || 1) : 1;
            return { used: totalUsed, capacity: capacity, exceeded: Math.max(0, totalUsed - capacity) };
        }

        window.addNewResource = function() {
            const name = prompt("Enter Name for new Resource:");
            if(!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            if(resKeys.includes(key)) return alert("Resource already exists");
            resKeys.push(key); resLabels.push(name);
            clusterState.forEach(c => c[key] = 0); projects.forEach(p => p[key] = 0);
            saveState(); refreshUI();
        }

        window.addCluster = function() {
            const name = prompt("Enter Name for new Cluster:");
            if(!name) return;
            const id = 'c_' + Date.now();
            clusterState.push({ id: id, name: name, ...Object.fromEntries(resKeys.map(k => [k, 0])) });
            saveState(); refreshUI();
        }

        window.removeCluster = function(id) {
            if(clusterState.length <= 1) return alert("Cannot delete the last cluster.");
            if(!confirm("Delete this cluster? Projects assigned to it will be moved to the first available cluster.")) return;
            const targetCluster = clusterState.find(c => c.id !== id);
            projects.forEach(p => { if(p.clusterId === id) p.clusterId = targetCluster.id; });
            clusterState = clusterState.filter(c => c.id !== id);
            saveState(); refreshUI();
        }

        window.removeResource = function(idx) {
            if(!confirm(`Remove resource column '${resLabels[idx]}'?`)) return;
            resKeys.splice(idx, 1); resLabels.splice(idx, 1);
            saveState(); refreshUI();
        }

        window.updateClusterName = (id, val) => { clusterState.find(c => c.id === id).name = val; saveState(); refreshUI(); };
        window.updateClusterCap = (id, k, val) => { clusterState.find(c => c.id === id)[k] = parseFloat(val) || 1; saveState(); refreshUI(); };
        window.updateLabel = (idx, val) => { resLabels[idx] = val.trim(); saveState(); refreshUI(); };
        window.updateProj = (idx, f, val) => {
            if(f !== 'name' && f !== 'clusterId' && f !== 'color') val = parseFloat(val) || 0;
            projects[idx][f] = val; saveState(); refreshUI();
        };
        window.removeProj = (idx) => { if(confirm('Delete?')) { projects.splice(idx, 1); saveState(); refreshUI(); } };
        window.duplicateProj = (idx) => {
            const copy = { ...projects[idx], id: Date.now() + Math.random(), name: projects[idx].name + " (Copy)" };
            projects.splice(idx + 1, 0, copy); saveState(); refreshUI();
        };
        function addProject() {
            projects.push({ id: Date.now(), name: 'New App', clusterId: clusterState[0].id, color: palette[projects.length % palette.length] });
            resKeys.forEach(k => projects[projects.length-1][k] = 0);
            saveState(); refreshUI();
        }
        function autoFitInput(input) {
            input.style.fontSize = '12px';
            if (input.scrollWidth > input.clientWidth) {
                const ratio = input.clientWidth / input.scrollWidth;
                const newSize = Math.max(9, Math.floor(12 * ratio));
                input.style.fontSize = newSize + 'px';
            }
        }

        // --- Drag Handlers (Unified) ---
        function handleDragStart(e) { 
            dragSrcEl = this; 
            e.dataTransfer.effectAllowed = 'move'; 
            this.classList.add('opacity-50'); 
            this.dataset.type = this.closest('tbody').id === 'clusterRows' ? 'cluster' : 'project';
        }
        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
        function handleDragEnter(e) { this.classList.add('bg-slate-200', 'dark:bg-slate-700'); }
        function handleDragLeave(e) { this.classList.remove('bg-slate-200', 'dark:bg-slate-700'); }
        function handleDrop(e) {
            e.stopPropagation();
            if (dragSrcEl !== this) {
                const srcType = dragSrcEl.dataset.type;
                const targetType = this.closest('tbody').id === 'clusterRows' ? 'cluster' : 'project';
                
                if (srcType === targetType) {
                    const srcIdx = parseInt(dragSrcEl.getAttribute('data-index'));
                    const targetIdx = parseInt(this.getAttribute('data-index'));
                    
                    if (srcType === 'project') {
                        const item = projects.splice(srcIdx, 1)[0];
                        projects.splice(targetIdx, 0, item);
                    } else {
                        const item = clusterState.splice(srcIdx, 1)[0];
                        clusterState.splice(targetIdx, 0, item);
                    }
                    saveState(); refreshUI();
                }
            }
            return false;
        }
        function handleDragEnd(e) { 
            this.classList.remove('opacity-50'); 
            document.querySelectorAll('tr').forEach(row => row.classList.remove('bg-slate-200', 'dark:bg-slate-700')); 
        }

        let touchDragItem = null;
        function handleTouchStart(e) { 
            touchDragItem = this.closest('tr'); 
            touchDragItem.classList.add('bg-slate-200', 'dark:bg-slate-700', 'opacity-70'); 
            touchDragItem.dataset.type = this.closest('tbody').id === 'clusterRows' ? 'cluster' : 'project';
        }
        function handleTouchMove(e) {
            if(!touchDragItem) return;
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetRow = target ? target.closest('tr') : null;
            
            if (targetRow && targetRow !== touchDragItem && targetRow.parentElement === touchDragItem.parentElement) {
                e.preventDefault(); 
                const srcIdx = parseInt(touchDragItem.getAttribute('data-index'));
                const targetIdx = parseInt(targetRow.getAttribute('data-index'));
                const type = touchDragItem.dataset.type;

                if (type === 'project') {
                    const item = projects.splice(srcIdx, 1)[0];
                    projects.splice(targetIdx, 0, item);
                    renderProjectTable();
                } else {
                    const item = clusterState.splice(srcIdx, 1)[0];
                    clusterState.splice(targetIdx, 0, item);
                    renderCapacityTable();
                }
                saveState(); updateChart();
                
                const rows = document.getElementById(type === 'project' ? 'projectRows' : 'clusterRows').children;
                touchDragItem = rows[targetIdx];
                touchDragItem.classList.add('bg-slate-200', 'dark:bg-slate-700', 'opacity-70');
                touchDragItem.dataset.type = type;
            }
        }
        function handleTouchEnd(e) { if(touchDragItem) { touchDragItem.classList.remove('bg-slate-200', 'dark:bg-slate-700', 'opacity-70'); touchDragItem = null; } }


        const inputBase = "autosize-input bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-1 py-0.5 text-xs text-slate-900 dark:text-slate-100 focus:ring-1 focus:ring-blue-500 focus:outline-none";
        const headerInput = "editable-header font-bold text-center text-slate-700 dark:text-slate-200";

        // Helper to construct elements safely
        function createEl(tag, className, props = {}) {
            const el = document.createElement(tag);
            if(className) el.className = className;
            Object.entries(props).forEach(([k, v]) => {
                if (k.startsWith('on')) el.addEventListener(k.substring(2).toLowerCase(), v);
                else if (k === 'text') el.textContent = v;
                else if (k === 'html') el.innerHTML = v;
                else el.setAttribute(k, v);
            });
            return el;
        }

        // Shared Drag Handle Creator
        function createDragHandle() {
            const td = createEl('td', 'p-1 text-center sticky-left-1 z-40');
            const span = createEl('div', 'drag-handle text-slate-400 text-sm', { text: '::' }); 
            span.addEventListener('touchstart', handleTouchStart, {passive: false});
            span.addEventListener('touchmove', handleTouchMove, {passive: false});
            span.addEventListener('touchend', handleTouchEnd);
            td.appendChild(span);
            return td;
        }

        function renderCapacityTable() {
            const table = document.getElementById('capacityTable');
            const thead = table.querySelector('thead');
            const tbody = document.getElementById('clusterRows');
            thead.innerHTML = ''; tbody.innerHTML = '';

            // Header
            const hRow = createEl('tr');
            hRow.appendChild(createEl('th', 'p-1 w-[30px] sticky-left-1 z-50'));
            // Cluster name header spans the width of sticky-2 (dup) and sticky-3 (name)
            hRow.appendChild(createEl('th', 'p-1 w-[134px] cluster-sticky-name z-50 text-[10px] uppercase text-slate-500', { text: 'Cluster' }));
            
            resLabels.forEach((label, idx) => {
                const th = createEl('th', 'p-1 min-w-[70px] relative');
                const div = createEl('div', headerInput, { text: label, contenteditable: "true", onBlur: (e) => updateLabel(idx, e.target.innerText) });
                const btn = createEl('button', 'absolute top-0 right-0 text-red-400 hover:text-red-600 text-[10px] w-4 h-4 z-10 font-bold', { text: '×', onClick: () => removeResource(idx) });
                th.appendChild(div); th.appendChild(btn);
                hRow.appendChild(th);
            });
            thead.appendChild(hRow);

            // Body
            const frag = document.createDocumentFragment();
            clusterState.forEach((c, idx) => {
                const tr = createEl('tr', '', { draggable: "true", "data-index": idx });
                tr.addEventListener('dragstart', handleDragStart);
                tr.addEventListener('dragover', handleDragOver);
                tr.addEventListener('dragenter', handleDragEnter);
                tr.addEventListener('dragleave', handleDragLeave);
                tr.addEventListener('drop', handleDrop);
                tr.addEventListener('dragend', handleDragEnd);
                
                // Drag Handle
                tr.appendChild(createDragHandle());

                // Cluster Name + Overlay Delete (Spanning the Sticky Name area)
                const tdName = createEl('td', 'p-1 cluster-sticky-name z-40');
                const wrapper = createEl('div', 'input-wrapper');
                // Added font-bold
                wrapper.appendChild(createEl('input', `${inputBase} font-bold pr-6`, { type: 'text', value: c.name, onChange: (e) => updateClusterName(c.id, e.target.value), onInput: (e) => autoFitInput(e.target) }));
                wrapper.appendChild(createEl('div', 'overlay-btn', { text: '×', onClick: () => removeCluster(c.id) }));
                tdName.appendChild(wrapper);
                tr.appendChild(tdName);

                // Resources
                resKeys.forEach((k, rIdx) => {
                    const stats = getClusterUsageStats(c.id, k);
                    const isErr = stats.exceeded > 0;
                    const idUnique = `cfg_${c.id}_${k}`;
                    const td = createEl('td', 'p-1');
                    const inp = createEl('input', `${inputBase} ${isErr ? 'input-error' : ''}`, { id: idUnique, type: 'number', value: c[k], min: 1, onChange: (e) => updateClusterCap(c.id, k, e.target.value), onInput: (e) => autoFitInput(e.target) });
                    td.appendChild(inp);
                    tr.appendChild(td);
                    
                    if(isErr) setTimeout(() => { const el = document.getElementById(idUnique); if(el) bindLongPress(el, () => showPopup(getUnifiedWarning(rIdx, c.id))); }, 0);
                });
                frag.appendChild(tr);
            });
            tbody.appendChild(frag);
            setTimeout(() => document.querySelectorAll('.autosize-input').forEach(autoFitInput), 10);
        }

        function renderProjectTable() {
            const table = document.getElementById('projectsTable');
            const thead = table.querySelector('thead');
            const tbody = document.getElementById('projectRows');
            thead.innerHTML = ''; tbody.innerHTML = '';

            let colsInTrouble = new Set();
            projects.forEach(p => {
                resKeys.forEach((k, rIdx) => {
                    const stats = getClusterUsageStats(p.clusterId, k);
                    if (stats.exceeded > 0 && parseFloat(p[k]) > 0) colsInTrouble.add(rIdx);
                });
            });

            // Header - Using the 3-layer sticky system
            const hRow = createEl('tr');
            hRow.appendChild(createEl('th', 'p-1 w-[30px] sticky-left-1 z-50 text-[10px] text-center text-slate-400', { text: '::' }));
            hRow.appendChild(createEl('th', 'p-1 w-[24px] sticky-left-2 z-50')); // Duplicate icon col
            hRow.appendChild(createEl('th', 'p-1 w-[110px] sticky-left-3 z-50 text-[10px] uppercase text-slate-500', { text: 'Name' }));
            
            hRow.appendChild(createEl('th', 'p-1 min-w-[20px] text-[10px] text-center', { text: 'C' }));
            hRow.appendChild(createEl('th', 'p-1 min-w-[90px] text-[10px] uppercase text-slate-500', { text: 'Assigned' }));
            
            resLabels.forEach((label, idx) => {
                hRow.appendChild(createEl('th', `p-1 min-w-[70px] ${colsInTrouble.has(idx) ? 'header-error' : ''} rounded text-[10px] uppercase text-slate-500`, { text: label }));
            });
            thead.appendChild(hRow);

            // Body
            const frag = document.createDocumentFragment();
            projects.forEach((p, idx) => {
                let isProjectInTrouble = false;
                let errorMessages = [];
                resKeys.forEach((k, rIdx) => {
                    const stats = getClusterUsageStats(p.clusterId, k);
                    if (stats.exceeded > 0 && parseFloat(p[k]) > 0) {
                        isProjectInTrouble = true;
                        errorMessages.push(getUnifiedWarning(rIdx, p.clusterId));
                    }
                });

                const tr = createEl('tr', '', { draggable: "true", "data-index": idx });
                tr.addEventListener('dragstart', handleDragStart);
                tr.addEventListener('dragover', handleDragOver);
                tr.addEventListener('dragenter', handleDragEnter);
                tr.addEventListener('dragleave', handleDragLeave);
                tr.addEventListener('drop', handleDrop);
                tr.addEventListener('dragend', handleDragEnd);

                // Handle (Sticky 1)
                tr.appendChild(createDragHandle());

                // Duplicate Button (Sticky 2)
                const tdDup = createEl('td', 'p-1 text-center sticky-left-2 z-40');
                const btnDup = createEl('button', 'text-amber-500 hover:text-amber-600', { html: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>', onClick: () => duplicateProj(idx) });
                tdDup.appendChild(btnDup);
                tr.appendChild(tdDup);

                // Name + Overlay Delete (Sticky 3)
                const nameId = `proj_name_${idx}`;
                const tdName = createEl('td', 'p-1 sticky-left-3 z-40');
                const wrapper = createEl('div', 'input-wrapper');
                // Added font-bold here
                wrapper.appendChild(createEl('input', `${inputBase} font-bold ${isProjectInTrouble ? 'input-error' : ''} pr-6`, { id: nameId, type: 'text', value: p.name, onChange: (e) => updateProj(idx, 'name', e.target.value), onInput: (e) => autoFitInput(e.target) }));
                wrapper.appendChild(createEl('div', 'overlay-btn', { text: '×', onClick: () => removeProj(idx) }));
                tdName.appendChild(wrapper);
                tr.appendChild(tdName);

                // Color
                const tdCol = createEl('td', 'p-1 text-center');
                const divCol = createEl('div', 'w-4 h-4 mx-auto rounded overflow-hidden relative');
                divCol.appendChild(createEl('div', 'absolute inset-0', { style: `background-color:${p.color}` }));
                divCol.appendChild(createEl('input', '', { type: 'color', value: p.color, onChange: (e) => updateProj(idx, 'color', e.target.value) }));
                tdCol.appendChild(divCol);
                tr.appendChild(tdCol);

                // Cluster Select
                const tdSel = createEl('td', 'p-1');
                const sel = createEl('select', inputBase, { onChange: (e) => updateProj(idx, 'clusterId', e.target.value) });
                clusterState.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id; opt.textContent = c.name;
                    if(c.id === p.clusterId) opt.selected = true;
                    sel.appendChild(opt);
                });
                tdSel.appendChild(sel);
                tr.appendChild(tdSel);

                // Resources
                resKeys.forEach(k => {
                    const tdRes = createEl('td', 'p-1');
                    tdRes.appendChild(createEl('input', inputBase, { type: 'number', value: p[k], min: 0, onChange: (e) => updateProj(idx, k, e.target.value), onInput: (e) => autoFitInput(e.target) }));
                    tr.appendChild(tdRes);
                });

                if(isProjectInTrouble) { setTimeout(() => { const el = document.getElementById(nameId); if(el) bindLongPress(el, () => showPopup(errorMessages[0])); }, 0); }
                frag.appendChild(tr);
            });
            tbody.appendChild(frag);
            setTimeout(() => document.querySelectorAll('.autosize-input').forEach(autoFitInput), 10);
        }

        function getCssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }

        const CLUSTER_WIDTH = 100;
        const GAP_WIDTH = 30; // Spacing between clusters
        const CLUSTER_STRIDE = CLUSTER_WIDTH + GAP_WIDTH;

        const gridOverlayPlugin = {
            id: 'gridOverlay',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx; const xAxis = chart.scales.x; const yAxis = chart.scales.y;
                const gridColor = localStorage.getItem('theme') === 'dark' ? '#cbd5e1' : '#1e293b';
                const separatorColor = '#0f172a'; // Black/Dark Slate for borders

                // 1. Draw 10-section grid within the Cluster Width (100 units)
                const oneUnitPx = (xAxis.getPixelForValue(100) - xAxis.getPixelForValue(0)) / 100;

                clusterState.forEach((c, i) => {
                    const startX = xAxis.getPixelForValue(i * CLUSTER_STRIDE);
                    
                    // Draw Cluster Grid
                    for(let j=1; j<=10; j++) {
                        const x = startX + (oneUnitPx * 10 * j);
                        ctx.save(); ctx.beginPath(); ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
                        // Make 100% line thicker
                        ctx.lineWidth = j===10 ? 2 : 0.5;
                        ctx.strokeStyle = j===10 ? gridColor : 'rgba(0,0,0,0.1)';
                        if(localStorage.getItem('theme') === 'dark' && j!==10) ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                        ctx.stroke(); ctx.restore();
                    }

                    // 2. Draw Column Separator (Left Border for all)
                    ctx.save(); ctx.beginPath();
                    ctx.moveTo(startX, yAxis.top); ctx.lineTo(startX, yAxis.bottom);
                    ctx.lineWidth = 1.5; ctx.strokeStyle = separatorColor; 
                    ctx.stroke(); ctx.restore();

                    // If last cluster, draw Right Edge too (Explicit Black)
                    if (i === clusterState.length - 1) {
                        const endX = startX + (oneUnitPx * 100);
                        ctx.save(); ctx.beginPath();
                        ctx.moveTo(endX, yAxis.top); ctx.lineTo(endX, yAxis.bottom);
                        ctx.lineWidth = 1.5; ctx.strokeStyle = separatorColor;
                        ctx.stroke(); ctx.restore();
                    }
                });

                // 3. DRAW OVERFLOW APPENDAGE
                const datasets = chart.data.datasets;
                clusterState.forEach((c, cIndex) => {
                    resKeys.forEach((key, rIndex) => {
                        const stats = getClusterUsageStats(c.id, key);
                        if (stats.exceeded > 0) {
                            let lastColor = '#ef4444';
                            for(let pIdx = projects.length - 1; pIdx >= 0; pIdx--) {
                                const p = projects[pIdx];
                                if (p.clusterId === c.id && parseFloat(p[key]) > 0 && !hiddenProjectIndices.has(pIdx)) {
                                    lastColor = p.color;
                                    break;
                                }
                            }

                            // Position box at 100% mark of this cluster
                            // The gap starts at 100 units.
                            const clusterEndVal = (cIndex * CLUSTER_STRIDE) + 100;
                            const xStartPx = xAxis.getPixelForValue(clusterEndVal);
                            const widthPx = oneUnitPx * (GAP_WIDTH - 5); 
                            
                            const meta = chart.getDatasetMeta(0);
                            const barModel = meta.data[rIndex];

                            if(barModel) {
                                const y = barModel.y;
                                const height = barModel.height; 
                                const top = y - height/2;
                                const gap = 2;

                                const boxX = xStartPx + gap;
                                const boxW = widthPx;

                                ctx.save();
                                
                                // Draw Stripes Manually
                                ctx.beginPath();
                                ctx.rect(boxX, top, boxW, height);
                                ctx.clip();

                                // Background
                                ctx.fillStyle = localStorage.getItem('theme') === 'dark' ? '#1e293b' : '#ffffff';
                                ctx.fill();

                                ctx.strokeStyle = lastColor;
                                ctx.lineWidth = 2; 
                                // Draw diagonals
                                for (let lx = boxX - height; lx < boxX + boxW; lx += 4) {
                                    ctx.beginPath();
                                    ctx.moveTo(lx, top + height);
                                    ctx.lineTo(lx + height, top);
                                    ctx.stroke();
                                }

                                ctx.restore();
                                ctx.strokeStyle = gridColor;
                                ctx.lineWidth = 1;
                                ctx.strokeRect(boxX, top, boxW, height);

                                // Bracket logic
                                ctx.beginPath();
                                ctx.moveTo(boxX, top - 1);
                                ctx.lineTo(boxX, top - 3);
                                ctx.lineTo(boxX + boxW, top - 3);
                                ctx.lineTo(boxX + boxW, top - 1);
                                ctx.strokeStyle = gridColor;
                                ctx.stroke();

                                ctx.fillStyle = gridColor;
                                ctx.font = 'bold 8px Arial'; // Smaller font
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'bottom';
                                const pct = Math.round((stats.exceeded / stats.capacity) * 100);
                                ctx.fillText(`+${pct}%`, boxX + boxW/2, top - 4); 
                            }
                        }
                    });
                });
            }
        };
        Chart.register(gridOverlayPlugin);

        function updateChart() {
            // Reduced rowHeight to remove excess whitespace
            const rowHeight = 35; 
            const neededHeight = (resKeys.length * rowHeight) + 40;
            const container = document.getElementById('chartContainer');
            if(container.clientHeight !== neededHeight) {
                container.style.height = neededHeight + 'px';
            }

            const ctx = document.getElementById('utilizationChart').getContext('2d');
            let usageMap = {}; clusterState.forEach(c => usageMap[c.id] = Array(resKeys.length).fill(0));
            let offsets = Array(resKeys.length).fill(0).map(() => ({})); clusterState.forEach(c => offsets.forEach(row => row[c.id] = 0));
            let datasets = [];
            const bgBarColor = getCssVar('--bg-grey-bar');
            const textColor = getCssVar('--chart-text');

            // BG Bars (The grey containers)
            clusterState.forEach((c, i) => {
                const startX = i * CLUSTER_STRIDE;
                datasets.push({
                    label: `_BG_${c.id}`, 
                    data: resKeys.map(() => [startX, startX + 100]), // Only draw 0 to 100
                    backgroundColor: bgBarColor, 
                    // High percentage to fill the row
                    barPercentage: 0.9, categoryPercentage: 0.9, 
                    grouped: false, order: 10, 
                    clusterId: c.id, clusterName: c.name
                });
            });

            // Project Bars
            projects.forEach((p, index) => {
                if(hiddenProjectIndices.has(index)) return;
                if(!usageMap[p.clusterId]) return;
                let pts = []; let bgColors = [];
                const cIndex = clusterState.findIndex(c => c.id === p.clusterId);
                const clusterBase = cIndex * CLUSTER_STRIDE;

                resKeys.forEach((key, rIdx) => {
                    const totalCap = parseFloat(clusterState[cIndex][key]) || 1;
                    const usedUnits = p[key];
                    const pct = (usedUnits / totalCap) * 100;
                    
                    let currentOffset = offsets[rIdx][p.clusterId];
                    let startVal = clusterBase + currentOffset;
                    
                    let visualStart = startVal;
                    let visualEnd = startVal + pct;
                    
                    if (currentOffset >= 100) {
                        pts.push(null);
                    } else {
                        if (visualEnd > clusterBase + 100) {
                            visualEnd = clusterBase + 100;
                        }
                        
                        if (visualEnd > visualStart) {
                            pts.push([visualStart, visualEnd]);
                        } else {
                            pts.push(null);
                        }
                    }

                    bgColors.push(p.color);
                    usageMap[p.clusterId][rIdx] += pct; 
                    offsets[rIdx][p.clusterId] += pct;
                });

                datasets.push({
                    label: p.name, data: pts, backgroundColor: bgColors,
                    barPercentage: 0.9, categoryPercentage: 0.9,
                    grouped: false, order: 1, originalIndex: index,
                });
            });

            const maxX = clusterState.length * CLUSTER_STRIDE;

            if (myChart) {
                myChart.data.labels = resLabels;
                myChart.data.datasets = datasets;
                myChart.options.scales.x.max = maxX;
                myChart.options.scales.x2.max = maxX;
                myChart.options.scales.x2.ticks.color = textColor;
                myChart.options.scales.y.ticks.color = textColor;
                
                // FORCE TICK UPDATE FOR CLUSTER NAMES
                // This ensures labels appear exactly in the middle of each cluster
                myChart.options.scales.x2.afterBuildTicks = (axis) => {
                    axis.ticks = clusterState.map((c, i) => ({
                        value: (i * CLUSTER_STRIDE) + (CLUSTER_WIDTH / 2)
                    }));
                };

                myChart.update();
            } else {
                myChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: resLabels, datasets: datasets },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                        onClick: (e, elements) => {},
                        scales: {
                            x: { min: 0, max: maxX, stacked: false, grid: { display: false }, ticks: { display: false } },
                            x2: { 
                                position: 'top', min: 0, max: maxX, grid: { display: false }, 
                                ticks: { 
                                    color: textColor, font: { weight: 'bold', size: 11 }, autoSkip: false, maxRotation: 0,
                                    callback: function(val, index) {
                                        // Since we force ticks in afterBuildTicks, the value passed here is exactly the cluster center
                                        const clusterIndex = Math.floor(val / CLUSTER_STRIDE);
                                        return clusterState[clusterIndex] ? clusterState[clusterIndex].name : '';
                                    }
                                },
                                // Force ticks at center of each cluster
                                afterBuildTicks: (axis) => {
                                    axis.ticks = clusterState.map((c, i) => ({
                                        value: (i * CLUSTER_STRIDE) + (CLUSTER_WIDTH / 2)
                                    }));
                                }
                            },
                            y: { stacked: false, ticks: { color: textColor, font: {size: 10} } }
                        },
                        plugins: {
                            legend: {
                                display: true, position: 'top',
                                labels: {
                                    filter: i => !i.text.startsWith('_BG_'),
                                    color: textColor,
                                    font: { size: 10 },
                                    boxWidth: 10,
                                    generateLabels: (chart) => {
                                        return projects.map((p, i) => ({
                                            text: p.name, fillStyle: p.color, hidden: hiddenProjectIndices.has(i), index: i, textDecoration: hiddenProjectIndices.has(i) ? 'line-through' : ''
                                        }));
                                    }
                                },
                                onClick: (e, legendItem, legend) => {
                                    const idx = legendItem.index;
                                    if(hiddenProjectIndices.has(idx)) hiddenProjectIndices.delete(idx); else hiddenProjectIndices.add(idx);
                                    setTimeout(() => updateChart(), 0);
                                }
                            },
                            tooltip: {
                                bodyFont: { size: 10 },
                                titleFont: { size: 10 },
                                callbacks: {
                                    label: function(ctx) {
                                        if (ctx.dataset.label.startsWith('_BG_')) {
                                            const cId = ctx.dataset.clusterId; const rIdx = ctx.dataIndex;
                                            if(!usageMap[cId]) return '';
                                            const total = clusterState.find(c => c.id === cId)[resKeys[rIdx]];
                                            const used = usageMap[cId][rIdx];
                                            const freePct = Math.max(0, 100 - used); const freeUnits = (freePct/100)*total;
                                            return [`Avail: ${freePct.toFixed(1)}%`, `${Math.floor(freeUnits)} / ${total}`];
                                        }
                                        const p = projects[ctx.dataset.originalIndex];
                                        if (!p) return '';
                                        const val = p[resKeys[ctx.dataIndex]] || 0;
                                        const cIndex = clusterState.findIndex(c => c.id === p.clusterId);
                                        const cap = parseFloat(clusterState[cIndex][resKeys[ctx.dataIndex]]) || 1;
                                        const realPct = (val / cap) * 100;
                                        return `${ctx.dataset.label}: ${realPct.toFixed(1)}% (${val})`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }
    </script>
</body>
