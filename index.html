<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5.0, user-scalable=yes">
    <title>Server Utilisation</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151e2e' } } } }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        /* Utilities */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input[type="color"] { 
            -webkit-appearance: none; border: none; padding: 0; 
            width: 24px; height: 24px; 
            border-radius: 4px; overflow: hidden; cursor: pointer; 
            background: none;
        }
        
        :root { --chart-text: #334155; --bg-grey-bar: #e2e8f0; --sticky-bg: #ffffff; }
        .dark { --chart-text: #cbd5e1; --bg-grey-bar: #334155; --sticky-bg: #1e293b; }

        /* Sticky Columns */
        .sticky-col-1 { position: sticky; left: 0; z-index: 30; background-color: var(--sticky-bg); }
        .sticky-col-2 { position: sticky; left: 45px; z-index: 30; background-color: var(--sticky-bg); border-right: 2px solid #e2e8f0; }
        .dark .sticky-col-2 { border-right-color: #334155; }

        /* Error States */
        .input-error { border: 2px solid #ef4444 !important; background-color: #fef2f2 !important; color: #b91c1c !important; }
        .dark .input-error { background-color: #450a0a !important; color: #fecaca !important; }
        .header-error { background-color: #ef4444 !important; color: white !important; }

        /* Draggable Cursor */
        .draggable-row { cursor: grab; }
        .draggable-row:active { cursor: grabbing; background-color: rgba(59, 130, 246, 0.1); }

        /* Text Input Auto-Size */
        .autosize-input { width: 100%; white-space: nowrap; overflow: hidden; transition: font-size 0.1s; }
        
        .editable-header { min-width: 80px; outline: none; cursor: text; display: block; padding-right: 20px; }
        .editable-header:focus { background-color: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Popup */
        #custom-popup { z-index: 9999; transition: opacity 0.2s, transform 0.2s; }
        #custom-popup.hidden-popup { opacity: 0; pointer-events: none; transform: translate(-50%, -20px); }
        #custom-popup.visible-popup { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen p-2 sm:p-4">

    <div id="error-log" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"></div>

    <!-- Popup -->
    <div id="custom-popup" class="hidden-popup fixed top-6 left-1/2 w-[90%] max-w-md bg-white dark:bg-slate-800 border-l-4 border-red-500 shadow-2xl rounded p-4 text-sm z-50">
        <div class="flex justify-between items-start">
            <div id="popup-content" class="text-slate-800 dark:text-slate-200 whitespace-pre-wrap font-medium"></div>
            <button id="btn-close-popup" class="text-slate-400 hover:text-slate-600 ml-2">✕</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- HEADER -->
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-3">
                <h1 class="text-lg sm:text-xl font-bold text-blue-600 dark:text-blue-400 whitespace-nowrap">Server Utilisation</h1>
                <div class="flex gap-2">
                    <button id="btnUpdate" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-1.5 px-3 rounded shadow">↻ Update</button>
                    <button id="btnReset" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1.5 px-3 rounded shadow">Reset</button>
                </div>
            </div>
            <button id="btnTheme" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition"><span class="text-xl">🌗</span></button>
        </div>

        <!-- MAIN GRID -->
        <div class="grid grid-cols-1 gap-4">
            
            <!-- CHART -->
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-semibold">Utilization</h2>
                    <span class="text-xs text-slate-500 dark:text-slate-400">Drag rows in table below to reorder</span>
                </div>
                <div class="bg-slate-50 dark:bg-slate-900/50 p-2 rounded border-l-4 border-blue-500 text-xs text-slate-600 dark:text-slate-400 mb-3">
                    <span class="inline-block w-3 h-3 bg-slate-300 mr-1 align-middle"></span> <strong>10 Sections</strong> = 10% each. 
                    <strong>Gap</strong> = Padding. <strong>Striped</strong> = Overloaded.
                </div>
                <div class="relative h-[500px] w-full">
                    <canvas id="utilizationChart"></canvas>
                </div>
            </div>

            <!-- CONFIG TABLE -->
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-semibold">1. Configuration</h2>
                    <div class="flex gap-2">
                         <button onclick="addNewCluster()" class="bg-purple-600 text-white text-xs font-bold py-1 px-2 rounded hover:bg-purple-700 shadow">+ Cluster</button>
                         <button onclick="addNewResource()" class="bg-green-600 text-white text-xs font-bold py-1 px-2 rounded hover:bg-green-700 shadow">+ Resource</button>
                    </div>
                </div>
                <div class="overflow-x-auto relative">
                    <table id="capacityTable" class="w-full text-left text-xs sm:text-sm border-collapse min-w-[600px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>

            <!-- PROJECTS TABLE -->
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-lg shadow border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-semibold">2. Project Workloads</h2>
                    <button id="btnAddProject" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1 px-3 rounded shadow transition">+ Add Workload</button>
                </div>
                <div class="overflow-x-auto relative">
                    <table id="projectsTable" class="w-full text-left text-xs sm:text-sm border-collapse min-w-[700px]">
                        <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"></thead>
                        <tbody id="projectRows" class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Error Handling
        window.onerror = function(msg) { 
            if(msg.includes('Script error')) return true; 
            const log = document.getElementById('error-log');
            log.classList.remove('hidden'); log.innerText = `Error: ${msg}`;
            return false; 
        };
        
        document.addEventListener('DOMContentLoaded', initApp);

        // State
        let clusterState = [];
        let projects = [];
        let resLabels = [];
        let resKeys = [];
        let myChart = null;

        // Initial Data
        const initialClusters = [
            { id: 'c1', name: 'Cluster 1', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c2', name: 'Cluster 2', vcpu: 100, ram: 500, storage_norm: 100, storage_fast: 20, vgpu: 10 },
            { id: 'c3', name: 'Cluster 3', vcpu: 200, ram: 1000, storage_norm: 200, storage_fast: 50, vgpu: 20 }
        ];
        const initialProjects = [
            { id: 1, name: 'Web Portal', clusterId: 'c1', vcpu: 20, ram: 50, storage_norm: 10, storage_fast: 0, vgpu: 0, color: '#E74C3C' },
            { id: 2, name: 'API Service', clusterId: 'c2', vcpu: 30, ram: 64, storage_norm: 20, storage_fast: 5, vgpu: 2, color: '#F1C40F' },
            { id: 3, name: 'Data Lake', clusterId: 'c3', vcpu: 50, ram: 200, storage_norm: 50, storage_fast: 10, vgpu: 5, color: '#3498DB' }
        ];
        const initialKeys = ['vcpu', 'ram', 'storage_norm', 'storage_fast', 'vgpu'];
        const initialLabels = ['vCPU', 'Memory', 'Normal Storage', 'Fast Storage', 'vGPU'];
        const palette = ['#E74C3C', '#3498DB', '#F1C40F', '#9B59B6', '#2ECC71', '#E67E22', '#1ABC9C', '#34495E'];

        function initApp() {
            if (typeof Chart === 'undefined') return;
            
            document.getElementById('btnUpdate').addEventListener('click', () => window.location.reload(true));
            document.getElementById('btnReset').addEventListener('click', resetDefaults);
            document.getElementById('btnTheme').addEventListener('click', toggleTheme);
            document.getElementById('btnAddProject').addEventListener('click', addProject);
            document.getElementById('btn-close-popup').addEventListener('click', hidePopup);

            // Drag and Drop Initialization
            new Sortable(document.getElementById('projectRows'), {
                animation: 150,
                handle: '.sticky-col-1', // Drag using the color/first column
                onEnd: function (evt) {
                    const item = projects.splice(evt.oldIndex, 1)[0];
                    projects.splice(evt.newIndex, 0, item);
                    saveState();
                    updateChart(); // Redraw chart to reflect new stack order
                }
            });

            if (!loadState()) resetDataToDefaults(false);
            applyThemeClass();
            refreshUI();
            
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
        }

        // --- Logic ---
        function resetDefaults() { 
            if(confirm("Reset data?")) resetDataToDefaults(true); 
        }

        function resetDataToDefaults(refresh) {
            clusterState = JSON.parse(JSON.stringify(initialClusters));
            projects = JSON.parse(JSON.stringify(initialProjects));
            resLabels = [...initialLabels];
            resKeys = [...initialKeys];
            saveState();
            if(refresh) refreshUI();
        }

        function loadState() {
            try {
                const stored = localStorage.getItem('serverDashboardData_v16');
                if (!stored) return false;
                const data = JSON.parse(stored);
                if (!data.clusters || !data.projects) return false;
                clusterState = data.clusters;
                projects = data.projects;
                resLabels = data.labels || [...initialLabels];
                resKeys = data.keys || [...initialKeys];
                if(data.theme) localStorage.setItem('theme', data.theme);
                return true;
            } catch(e) { return false; }
        }

        function saveState() {
            const data = {
                clusters: clusterState, projects: projects, 
                labels: resLabels, keys: resKeys,
                theme: localStorage.getItem('theme') || 'light'
            };
            localStorage.setItem('serverDashboardData_v16', JSON.stringify(data));
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', current);
            applyThemeClass(); saveState(); updateChart();
        }

        function applyThemeClass() {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function refreshUI() {
            renderCapacityTable(); renderProjectTable(); updateChart();
        }

        // --- Data Manipulation ---
        window.addNewResource = function() {
            const name = prompt("Name for new Resource:");
            if(!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            resKeys.push(key); resLabels.push(name);
            clusterState.forEach(c => c[key] = 0); projects.forEach(p => p[key] = 0);
            saveState(); refreshUI();
        }

        window.addNewCluster = function() {
            const id = 'c' + (Date.now());
            clusterState.push({ id: id, name: 'New Cluster', ...Object.fromEntries(resKeys.map(k=>[k, 100])) });
            saveState(); refreshUI();
        }

        window.removeResource = (idx) => {
            if(confirm(`Remove '${resLabels[idx]}'?`)) {
                resKeys.splice(idx, 1); resLabels.splice(idx, 1);
                saveState(); refreshUI();
            }
        };

        window.removeCluster = (idx) => {
            if(confirm("Remove this cluster?")) {
                const cId = clusterState[idx].id;
                clusterState.splice(idx, 1);
                // Reset projects assigned to this cluster to the first available or null
                projects.forEach(p => { if(p.clusterId === cId) p.clusterId = clusterState[0]?.id || ''; });
                saveState(); refreshUI();
            }
        }

        window.updateClusterName = (id, val) => { clusterState.find(c => c.id === id).name = val; saveState(); renderProjectTable(); updateChart(); };
        window.updateClusterCap = (id, k, val) => { clusterState.find(c => c.id === id)[k] = parseFloat(val) || 1; saveState(); refreshUI(); }; // Full refresh to update red headers
        window.updateLabel = (idx, val) => { resLabels[idx] = val; saveState(); renderProjectTable(); updateChart(); };
        
        window.updateProj = (idx, field, val) => {
            if(field !== 'name' && field !== 'clusterId' && field !== 'color') val = parseFloat(val) || 0;
            projects[idx][field] = val;
            saveState(); renderCapacityTable(); renderProjectTable(); updateChart();
        };

        window.removeProj = (idx) => { if(confirm('Delete?')) { projects.splice(idx, 1); saveState(); refreshUI(); } };
        window.duplicateProj = (idx) => {
            const copy = { ...projects[idx], id: Date.now(), name: projects[idx].name + " (Copy)" };
            projects.splice(idx + 1, 0, copy); saveState(); refreshUI();
        };
        
        function addProject() {
            projects.push({ id: Date.now(), name: 'New App', clusterId: clusterState[0]?.id, color: palette[projects.length % palette.length] });
            resKeys.forEach(k => projects[projects.length-1][k] = 0);
            saveState(); refreshUI();
        }

        // --- Calculations ---
        function getClusterUsageStats(clusterId, resourceKey) {
            let totalUsed = 0;
            projects.forEach(p => { if(p.clusterId === clusterId) totalUsed += (parseFloat(p[resourceKey]) || 0); });
            const cluster = clusterState.find(c => c.id === clusterId);
            const capacity = cluster ? (parseFloat(cluster[resourceKey]) || 1) : 1;
            return { used: totalUsed, capacity: capacity, exceeded: Math.max(0, totalUsed - capacity) };
        }

        // --- Renderers ---
        const inputBase = "autosize-input bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-1 py-1 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 text-xs";

        function renderCapacityTable() {
            const table = document.getElementById('capacityTable');
            let thead = `<tr><th class="p-2 min-w-[90px] sticky-col-1">Cluster</th>`;
            resLabels.forEach((l, i) => {
                thead += `<th class="p-2 min-w-[100px] relative group">
                    <div contenteditable="true" class="editable-header font-bold text-center" onblur="updateLabel(${i}, this.innerText)">${l}</div>
                    <button onclick="removeResource(${i})" class="hidden group-hover:block absolute top-0 right-0 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] leading-3">×</button>
                </th>`;
            });
            thead += `</tr>`;
            table.querySelector('thead').innerHTML = thead;

            let tbody = '';
            clusterState.forEach((c, idx) => {
                let row = `<td class="p-1 sticky-col-1 relative group">
                    <input type="text" class="${inputBase} font-bold" value="${c.name}" onchange="updateClusterName('${c.id}', this.value)">
                    <button onclick="removeCluster(${idx})" class="hidden group-hover:block absolute top-1 right-1 text-red-500 font-bold px-1">×</button>
                </td>`;
                resKeys.forEach((k) => {
                    const stats = getClusterUsageStats(c.id, k);
                    const errClass = stats.exceeded > 0 ? 'input-error' : '';
                    row += `<td class="p-1"><input type="number" class="${inputBase} ${errClass}" value="${c[k]}" onchange="updateClusterCap('${c.id}', '${k}', this.value)" min="1"></td>`;
                });
                tbody += `<tr>${row}</tr>`;
            });
            table.querySelector('tbody').innerHTML = tbody;
        }

        function renderProjectTable() {
            const table = document.getElementById('projectsTable');
            
            // Calculate which headers (Resources) are overloaded in ANY cluster
            const overloadedIndices = new Set();
            resKeys.forEach((k, rIdx) => {
                const anyOverload = clusterState.some(c => getClusterUsageStats(c.id, k).exceeded > 0);
                if(anyOverload) overloadedIndices.add(rIdx);
            });

            let thead = `<tr>
                <th class="p-2 w-[30px] sticky-col-1 z-30">#</th>
                <th class="p-2 min-w-[100px] sticky-col-2 z-30">Name</th>
                <th class="p-2 min-w-[120px]">Assigned</th>`;
            resLabels.forEach((l, i) => {
                // Header Red if Resource is Overloaded
                const headerClass = overloadedIndices.has(i) ? 'header-error' : '';
                thead += `<th class="p-2 min-w-[80px] ${headerClass} rounded-t">${l}</th>`;
            });
            thead += `<th class="p-2 w-24 text-center">Act</th></tr>`;
            table.querySelector('thead').innerHTML = thead;

            const tbody = document.getElementById('projectRows');
            tbody.innerHTML = '';
            
            projects.forEach((p, idx) => {
                // Check if this project contributes to an overload
                let isTrouble = false;
                resKeys.forEach(k => {
                    const stats = getClusterUsageStats(p.clusterId, k);
                    if(stats.exceeded > 0 && parseFloat(p[k]) > 0) isTrouble = true;
                });
                const nameErr = isTrouble ? 'input-error' : '';

                const opts = clusterState.map(c => `<option value="${c.id}" ${c.id === p.clusterId ? 'selected' : ''}>${c.name}</option>`).join('');
                
                let row = `
                    <td class="p-1 text-center sticky-col-1 draggable-row" title="Drag to reorder">
                        <input type="color" value="${p.color}" onchange="updateProj(${idx}, 'color', this.value)" class="cursor-pointer">
                    </td>
                    <td class="p-1 sticky-col-2"><input type="text" class="${inputBase} ${nameErr}" value="${p.name}" onchange="updateProj(${idx}, 'name', this.value)"></td>
                    <td class="p-1"><select class="${inputBase}" onchange="updateProj(${idx}, 'clusterId', this.value)">${opts}</select></td>`;
                
                resKeys.forEach(k => {
                    // Value Cells are NOT red anymore, per request
                    row += `<td class="p-1"><input type="number" class="${inputBase}" value="${p[k]}" onchange="updateProj(${idx}, '${k}', this.value)" min="0"></td>`;
                });
                
                row += `<td class="p-1 text-center flex justify-center gap-1">
                    <button class="bg-amber-500 text-white p-1 rounded" onclick="duplicateProj(${idx})">📄</button>
                    <button class="bg-red-500 text-white p-1 rounded" onclick="removeProj(${idx})">×</button>
                </td>`;
                tbody.innerHTML += `<tr class="bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700">${row}</tr>`;
            });
        }

        // --- Chart ---
        function getCssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
        function getStripePattern(color) {
            const c = document.createElement('canvas'); const x = c.getContext('2d');
            c.width=10; c.height=10; x.fillStyle=color; x.fillRect(0,0,10,10);
            x.strokeStyle='rgba(255,255,255,0.7)'; x.lineWidth=2; x.beginPath(); x.moveTo(0,10); x.lineTo(10,0); x.stroke();
            return c;
        }

        const gridOverlayPlugin = {
            id: 'gridOverlay',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx; const xAxis = chart.scales.x; const yAxis = chart.scales.y;
                const majorColor = localStorage.getItem('theme') === 'dark' ? '#cbd5e1' : '#1e293b';
                
                // Draw 10 Sections (10% lines) for each cluster
                clusterState.forEach((c, idx) => {
                    const base = idx * 100;
                    // Draw 10% subdivisions
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; // Clear black borders
                    ctx.lineWidth = 1;
                    for(let i=1; i<10; i++) {
                        const x = xAxis.getPixelForValue(base + (i*10));
                        ctx.beginPath(); ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom); ctx.stroke();
                    }
                    // Draw Cluster Divider (Thick)
                    const endX = xAxis.getPixelForValue(base + 100);
                    ctx.strokeStyle = majorColor; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(endX, yAxis.top); ctx.lineTo(endX, yAxis.bottom); ctx.stroke();
                });
            }
        };
        Chart.register(gridOverlayPlugin);

        function updateChart() {
            const ctx = document.getElementById('utilizationChart').getContext('2d');
            let offsets = Array(resKeys.length).fill(0).map(() => ({})); 
            clusterState.forEach(c => offsets.forEach(row => row[c.id] = 0));
            let datasets = [];

            // Background (Capacity) - Just 0 to 100 relative
            const bgBarColor = getCssVar('--bg-grey-bar');
            clusterState.forEach((c, i) => {
                datasets.push({
                    label: `_BG_${c.id}`, 
                    data: resKeys.map(() => [i*100, (i*100)+100]),
                    backgroundColor: bgBarColor, 
                    barPercentage: 0.9, categoryPercentage: 0.9, grouped: false, order: 10,
                    clusterId: c.id
                });
            });

            // Project Bars
            const GAP = 1; // Gap between dividers and bars
            projects.forEach((p, index) => {
                let pts = []; let bgColors = [];
                const cIndex = clusterState.findIndex(c => c.id === p.clusterId);
                if (cIndex === -1) return; 

                const base = cIndex * 100;
                const clusterObj = clusterState[cIndex];

                resKeys.forEach((key, rIdx) => {
                    const cap = parseFloat(clusterObj[key]) || 1;
                    const pct = (p[key] / cap) * 100;
                    
                    let start = base + offsets[rIdx][p.clusterId];
                    let end = start + pct;
                    let isOverloaded = false;

                    // Apply Gaps at edges
                    let drawStart = start; 
                    let drawEnd = end;

                    // If Start is the 0 line, push it slightly
                    if (Math.abs(start - base) < 0.1) drawStart += GAP;
                    
                    // Cap visual at 100%
                    if (end > base + 100) { 
                        drawEnd = base + 100 - GAP; 
                        isOverloaded = true; 
                    } else if (Math.abs(end - (base+100)) < 0.1) {
                         drawEnd -= GAP; // Don't touch right line
                    }

                    if (pct > 0 && start < end) {
                        pts.push([drawStart, drawEnd]);
                    } else if (isOverloaded) {
                        pts.push([drawStart, drawEnd]); // Draw overload truncated
                    } else {
                        pts.push(null);
                    }
                    
                    bgColors.push(isOverloaded ? ctx.createPattern(getStripePattern(p.color), 'repeat') : p.color);
                    offsets[rIdx][p.clusterId] += pct;
                });
                
                datasets.push({ 
                    label: p.name, data: pts, backgroundColor: bgColors,
                    barPercentage: 0.9, categoryPercentage: 0.9, grouped: false, order: 1,
                    originalIndex: index
                });
            });

            if (myChart) myChart.destroy();
            const textColor = getCssVar('--chart-text');
            const maxVal = clusterState.length * 100;

            myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: resLabels, datasets: datasets },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { 
                            min: 0, max: maxVal, stacked: false, 
                            grid: { display: false }, 
                            ticks: { 
                                color: textColor, 
                                callback: v => (v % 100 === 0 && v !== 0 && v !== maxVal) ? '100% / 0%' : (v===0 || v===maxVal) ? (v===0?'0%':'100%') : '' 
                            } 
                        },
                        x2: { 
                            position: 'top', min: 0, max: maxVal, grid: { display: false }, 
                            ticks: { 
                                color: textColor, font: { weight: 'bold', size: 12 }, 
                                callback: v => {
                                    if(v % 100 === 50) {
                                        const idx = Math.floor(v/100);
                                        return clusterState[idx]?.name || '';
                                    }
                                    return '';
                                } 
                            } 
                        },
                        y: { stacked: false, ticks: { color: textColor, font: {size: 11} } }
                    },
                    plugins: {
                        legend: { 
                            display: true, position: 'top', 
                            labels: { filter: i => !i.text.startsWith('_BG_'), color: textColor },
                            onClick: (e, item) => {
                                // Default hide logic
                                const idx = item.datasetIndex;
                                const ci = myChart;
                                if (ci.isDatasetVisible(idx)) ci.hide(idx); else ci.show(idx);
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    if (ctx.dataset.label.startsWith('_BG_')) return '';
                                    const p = projects[ctx.dataset.originalIndex];
                                    if (!p) return '';
                                    const val = p[resKeys[ctx.dataIndex]] || 0;
                                    return `${ctx.dataset.label}: ${val}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Popup Logic
        function showPopup(msg) {
            const popup = document.getElementById('custom-popup');
            document.getElementById('popup-content').innerText = msg;
            popup.classList.remove('hidden-popup'); popup.classList.add('visible-popup');
            setTimeout(hidePopup, 3000);
        }
        function hidePopup() {
            const p = document.getElementById('custom-popup');
            p.classList.remove('visible-popup'); p.classList.add('hidden-popup');
        }
    </script>
</body>
</html>
